name: Bug report / Báo lỗi
description: Something does not convert or behaves unexpectedly. / Có tệp không chuyển được hoặc app chạy sai.
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: App version / Phiên bản app
      description: Settings › About
      placeholder: "1.2.0"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac model / Phiên bản macOS và dòng máy
      placeholder: "macOS 15.4, MacBook Air M2"
    validations:
      required: true
  - type: input
    id: conversion
    attributes:
      label: Conversion / Chuyển từ → sang
      placeholder: "HEIC → JPG"
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened? / Chuyện gì xảy ra?
      description: Steps, the error shown, and what you expected. Do not attach private files; a small sample is enough. / Các bước, thông báo lỗi và kết quả mong đợi. Không đính kèm tệp riêng tư.
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log (optional) / Nhật ký (không bắt buộc)
      description: Last lines of ~/Library/Logs/org.xuanhieu.quickconvertformat/app.log
      render: text
